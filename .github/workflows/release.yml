name: Build and Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    environment: env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env for packaged app
        shell: pwsh
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TWITCH_CLIENT_ID)) {
            throw "Missing TWITCH_CLIENT_ID in GitHub Environment 'env' or repository secrets"
          }

          $lines = @(
            "TWITCH_CLIENT_ID=$env:TWITCH_CLIENT_ID"
          )

          Set-Content -Path ".env" -Value ($lines -join "`n") -NoNewline -Encoding utf8

      - name: Build and publish artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always